name: Build and publish app installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release version tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:win
      - name: Name Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated." }
          Move-Item $installer.FullName release/Yemzor-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/Yemzor-Setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: release/Yemzor.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Yemzor ${{ inputs.release_tag }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
